<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills | Progress Bars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="skills-section">
        <div class="container">
            <p class="subtitle">WHAT I KNOW</p>
            <h1>My Skills</h1>
            <p class="description">
                A little showcase of the skills I'm learning
                and improving every day.
            </p>

            <div class="skills-list">
                <div class="skill">
                    <div class="skill-info">
                        <span>HTML5</span>
                        <span>90%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" data-width="90%"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>CSS3</span>
                        <span>85%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" data-width="85%"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>JavaScript</span>
                        <span>75%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" data-width="75%"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>Python</span>
                        <span>80%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" data-width="80%"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>React</span>
                        <span>65%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" data-width="65%"></div>
                    </div>
                </div>
            </div>

            <p class="footer-text">Always learning. Always growing. ✨</p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
